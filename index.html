<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magazijnuitgifte – Werknemer | Stolt Haven Moerdijk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap container">
      <div class="brand">
        <img src="img/stolt_nielsen_logo.png" alt="Stolt-Nielsen" class="logo" />
        <div class="titles">
          <h1>Magazijnuitgifte – Petrochemie</h1>
          <p class="subtitle">Interne bestellingen (per locatie)</p>
        </div>
      </div>
      <nav><a class="btn" href="admin.html">Beheer (admin)</a></nav>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <label>Locatie:
        <select id="locationSelect"></select>
      </label>
    </div>

    <section>
      <div id="productsGrid" class="grid"></div>
    </section>

    <section class="section" style="margin:16px 0">
      <form id="orderForm" class="controls" style="padding:0">
        <label>Naam
          <input type="text" id="naam" required placeholder="Voor- en achternaam">
        </label>
        <button class="btn primary" type="submit">Bestelling versturen</button>
        <span class="small">Kies één artikel en maat; bestelling = 1 stuk.</span>
      </form>
    </section>
  </main>

  <footer>© <span id="year"></span> Stolt Haven Moerdijk</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.employee.locations.js"></script>
</body>
</html>
