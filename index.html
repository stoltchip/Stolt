<!doctype html>
<html lang="nl">
<head>

  <main class="container">

    <div id="productsGrid" class="grid"></div>

    <div style="margin-top:24px">
      <a href="./admin.html">→ Beheer (admin)</a>

  <!-- WAŻNE: kolejność -->
