<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magazijn – Werknemer</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./img/stolt_nielsen_logo.png">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="./img/stolt_nielsen_logo.png" alt="Stolt-Nielsen logo">
      <h1>Stolt Haven Moerdijk – Werknemer</h1>
      <span class="badge">Licht thema</span>
    </div>

    <div class="row" style="justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div class="row" style="gap:8px">
        <label for="locSelect">Locatie:</label>
        <select id="locSelect"></select>
      </div>
      <div class="row" style="gap:8px">
        <label for="naamInput">Naam:</label>
        <input id="naamInput" type="text" placeholder="Jouw naam" required>
      </div>
    </div>

    <p class="notice" id="info">Kies een locatie om de voorraad te laden.</p>

    <div id="productsGrid" class="grid"></div>

    <div class="footer">
      <a href="./admin.html">→ Beheer (admin)</a>
    </div>
  </div>

  <script type="module" src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./script.employee.locations.js"></script>
</body>
</html>
