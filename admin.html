<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Beheer – Magazijn</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="brand"><img src="img/stolt_nielsen_logo.png" class="logo"><div class="titles"><h1>Beheer – Magazijn</h1><p class="subtitle">Wachtwoord + PIN</p></div></div><nav class="actions"><a href="index.html" class="btn">Terug</a></nav></header><main class="panel center"><section id="loginBox" class="login-box"><h2>Inloggen</h2><form id="loginForm" class="form-grid"><label>Wachtwoord<input type="password" id="pw" required></label><label>PIN<input type="password" id="pin" maxlength="6" required></label><button class="btn primary" type="submit">Inloggen</button></form><p id="loginMsg" class="help"></p></section><section id="adminPanel" class="hidden"><h2>Voorraad</h2><div id="inventoryTableWrap" class="table-wrap"></div><h3>Nieuw product</h3><form id="addProductForm" class="form-grid"><label>Naam<input id="newName" required></label><label>Beschrijving<textarea id="newDesc" required></textarea></label><label>Afbeelding<input type="file" id="newImage" accept="image/*"></label><label>Maten<input id="newSizes" placeholder="S,M,L of 39,40" required></label><label>Startvoorraad<input type="number" id="newQty" value="3" min="0" required></label><button class="btn primary" type="submit">Toevoegen</button></form></section></main><footer class="site-footer"><small>© <span id="year"></span> Stolt Haven Moerdijk</small></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="script.admin.js"></script></body></html>
